name: CI

on: [pull_request]

concurrency:
  group: ci_${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library Build & Tests
    runs-on: [self-hosted, autoscaling, oracle9, ruby3.0.6, gomobilesharedstagedeploy]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          path: ./node_modules
          key: library-npm-${{ hashFiles('package-lock.json') }}

      - name: Read .nvmrc
        run: echo NVMRC=`cat .nvmrc` >> $GITHUB_ENV

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NVMRC }}

      - name: Install npm Packages
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci || {
            echo "npm ci failed, falling back to npm install"
            npm install
          }

      - name: Gitleaks Secrets Scan
        run: |
          # gitleaks image pinned by digest -> v8.30.1 (supply-chain hardening)
          docker run --rm \
              -v ${{ github.workspace }}:/workspace \
              -w /workspace \
              zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
              detect \
              --source /workspace \
              --no-git \
              --config /workspace/.gitleaks.toml \
              --report-format table \
              --redact \
              --exit-code ${{ vars.GITLEAKS_EXIT_CODE || '0' }} \
              --verbose

      - name: Trivy Security Scan
        uses: ./.github/actions/trivy_security_scan
        with:
          services_dashboard_url: ${{ vars.SERVICES_DASHBOARD_URL }}
          vuln_fail_severities: ${{ vars.TRIVY_VULN_FAIL_SEVERITIES }}
          license_fail_severities: ${{ vars.TRIVY_LICENSE_FAIL_SEVERITIES }}

      - name: Run Production Build
        run: npm run build_lib

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2

      - name: Setup CHROME_BIN env variable
        run: |
          ${{ steps.setup-chrome.outputs.chrome-path }} --version
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - name: Run Tests
        run: npm run test_lib:ci

      - name: Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: >
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
            -Dsonar.verbose=false
            -Dsonar.working.directory=.scannerwork

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        with:
          scanMetadataReportFile: '.scannerwork/report-task.txt'
        timeout-minutes: 7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
